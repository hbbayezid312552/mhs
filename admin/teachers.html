<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শিক্ষক ব্যবস্থাপনা | Admin Panel</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">
<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <button class="mobile-admin-toggle btn btn-outline btn-sm" id="admin-sidebar-toggle">☰ মেনু</button>
      <h1>শিক্ষক ব্যবস্থাপনা</h1>
      <button class="btn btn-primary" id="add-teacher-btn">+ শিক্ষক যোগ করুন</button>
    </div>
    <div class="admin-panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>ছবি</th><th>নাম</th><th>পদবি</th><th>বিষয়</th><th>অ্যাকশন</th></tr></thead>
          <tbody id="teachers-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="teacher-modal">
  <div class="modal-box">
    <h3 id="teacher-modal-title">নতুন শিক্ষক যোগ করুন</h3>
    <form id="teacher-form">
      <input type="hidden" id="teacher-doc-id">
      <div class="form-group"><label>পূর্ণ নাম</label><input class="form-control" id="t-name" required></div>
      <div class="form-row">
        <div class="form-group"><label>পদবি</label><input class="form-control" id="t-designation" required></div>
        <div class="form-group"><label>বিষয়</label><input class="form-control" id="t-subject" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>শিক্ষাগত যোগ্যতা</label><input class="form-control" id="t-qualification"></div>
        <div class="form-group"><label>মোবাইল</label><input class="form-control" id="t-mobile"></div>
      </div>
      <div class="form-group"><label>সংক্ষিপ্ত জীবনী</label><textarea class="form-control" id="t-bio" rows="3"></textarea></div>
      <div class="form-group"><label>শিক্ষকের ছবি</label><input type="file" class="form-control" id="t-photo" accept="image/*"></div>
      <div class="flex gap-12 mt-16">
        <button type="button" class="btn btn-outline btn-block" onclick="closeTeacherModal()">বাতিল</button>
        <button type="submit" class="btn btn-primary btn-block">সংরক্ষণ করুন</button>
      </div>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/firebase.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/teachers.js"></script>
<script>document.addEventListener("DOMContentLoaded", () => guardAdminPage());</script>
</body>
</html>
