<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>গ্যালারি ব্যবস্থাপনা | Admin Panel</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">
<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <button class="mobile-admin-toggle btn btn-outline btn-sm" id="admin-sidebar-toggle">☰ মেনু</button>
      <h1>গ্যালারি ব্যবস্থাপনা</h1>
    </div>

    <div class="admin-panel">
      <h3 style="color:var(--deep-green);margin-bottom:14px">নতুন ছবি আপলোড করুন</h3>
      <form id="gallery-upload-form" class="form-row" style="align-items:end">
        <div class="form-group"><label>ছবি নির্বাচন করুন</label><input type="file" class="form-control" id="g-file" accept="image/*" required></div>
        <div class="form-group"><label>ক্যাপশন</label><input class="form-control" id="g-caption"></div>
        <div class="form-group"><label>অ্যালবাম</label><input class="form-control" id="g-album" placeholder="যেমনঃ ক্যাম্পাস"></div>
        <div class="form-group"><button type="submit" class="btn btn-primary btn-block">আপলোড করুন</button></div>
      </form>
    </div>

    <div class="admin-panel">
      <h3 style="color:var(--deep-green);margin-bottom:14px">সকল ছবি</h3>
      <div id="admin-gallery-grid"></div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/firebase.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/gallery.js"></script>
<script>document.addEventListener("DOMContentLoaded", () => guardAdminPage());</script>
</body>
</html>
