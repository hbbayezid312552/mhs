<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ফলাফল ব্যবস্থাপনা | Admin Panel</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">
<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <button class="mobile-admin-toggle btn btn-outline btn-sm" id="admin-sidebar-toggle">☰ মেনু</button>
      <h1>ফলাফল ব্যবস্থাপনা</h1>
      <button class="btn btn-primary" id="add-result-btn">+ ফলাফল যোগ করুন</button>
    </div>
    <div class="admin-panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>শিক্ষার্থী</th><th>শ্রেণি/রোল</th><th>পরীক্ষা</th><th>গ্রেড</th><th>অবস্থা</th><th>অ্যাকশন</th></tr></thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="result-modal">
  <div class="modal-box" style="max-width:640px">
    <h3>শিক্ষার্থীর নম্বর এন্ট্রি</h3>
    <form id="result-form">
      <div class="form-row">
        <div class="form-group"><label>পরীক্ষা</label><select class="form-control" id="f-res-exam" required></select></div>
        <div class="form-group"><label>শ্রেণি</label><select class="form-control" id="f-res-class" required></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>শাখা</label><input class="form-control" id="f-res-section"></div>
        <div class="form-group"><label>রোল</label><input class="form-control" id="f-res-roll" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>শিক্ষার্থী আইডি</label><input class="form-control" id="f-res-studentId" required></div>
        <div class="form-group"><label>শিক্ষার্থীর নাম</label><input class="form-control" id="f-res-name" required></div>
      </div>
      <div class="form-group"><label>ছবির URL (ঐচ্ছিক)</label><input class="form-control" id="f-res-photo" placeholder="https://..."></div>
      <h4 style="color:var(--deep-green);margin:14px 0 8px">বিষয়ভিত্তিক নম্বর</h4>
      <div class="form-row" id="marks-fields" style="grid-template-columns:repeat(3,1fr)"></div>
      <div class="flex gap-12 mt-16">
        <button type="button" class="btn btn-outline btn-block" onclick="document.getElementById('result-modal').classList.remove('open')">বাতিল</button>
        <button type="submit" class="btn btn-primary btn-block">সংরক্ষণ করুন</button>
      </div>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/firebase.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/results.js"></script>
<script>document.addEventListener("DOMContentLoaded", () => guardAdminPage());</script>
</body>
</html>
